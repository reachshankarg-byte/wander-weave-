version: '3'
services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: wanderweave
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
  # Add more services as we go
volumes:
  db-data:
